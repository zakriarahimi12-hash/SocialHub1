<script>
/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
  "https://gkqyaroprqajwoubnsvs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_R7vD8tuifiaNOAhOSQdAyw_Ie4OHa7f";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ============================================================
   GLOBAL VARIABLES
============================================================ */

let currentUser = null;
let currentProfile = null;
let selectedImage = null;


/* ============================================================
   AUTH
============================================================ */

async function signup() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const username =
    document.getElementById("username").value.trim();

  if (!email || !password || !username) {

    showMessage(
      "Please fill in email, password and username."
    );

    return;
  }

  if (password.length < 6) {

    showMessage(
      "Password must be at least 6 characters."
    );

    return;
  }

  showMessage("Creating account...");

  const {
    data,
    error
  } = await client.auth.signUp({

    email,

    password,

    options: {
      data: {
        username: username
      }
    }

  });

  if (error) {

    showMessage(error.message);

    return;
  }

  /*
    Supabase can require email confirmation.
    In that case there is no active session yet.
  */

  if (!data.session) {

    document.getElementById(
      "signup-form"
    ).style.display = "none";

    document.getElementById(
      "verification"
    ).style.display = "block";

    document.getElementById(
      "verificationEmail"
    ).textContent = email;

    showMessage(
      "Check your email for the verification link."
    );

    return;
  }

  currentUser = data.user;

  await createProfile(username);

  showApp();
}


/* ============================================================
   LOGIN
============================================================ */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {

    showMessage(
      "Enter your email and password."
    );

    return;
  }

  showMessage("Logging in...");

  const {
    data,
    error
  } = await client.auth.signInWithPassword({

    email,

    password

  });

  if (error) {

    showMessage(error.message);

    return;
  }

  currentUser = data.user;

  await loadProfile();

  showApp();
}


/* ============================================================
   CHECK VERIFICATION
============================================================ */

async function checkVerification() {

  const {
    data,
    error
  } = await client.auth.getSession();

  if (error) {

    showMessage(error.message);

    return;
  }

  if (data.session) {

    currentUser =
      data.session.user;

    await loadProfile();

    showApp();

  } else {

    showMessage(
      "Your email has not been verified yet. Click the link in the email, then try again."
    );

  }
}


function backToSignup() {

  document.getElementById(
    "signup-form"
  ).style.display = "block";

  document.getElementById(
    "verification"
  ).style.display = "none";

  showMessage("");

}


/* ============================================================
   LOGOUT
============================================================ */

async function logout() {

  await client.auth.signOut();

  currentUser = null;

  location.reload();

}


/* ============================================================
   PROFILE
============================================================ */

async function createProfile(username) {

  if (!currentUser) return;

  const {
    error
  } = await client
    .from("profiles")
    .upsert({
      id: currentUser.id,
      username: username
    });

  /*
    If your profiles table does not exist yet,
    account creation still succeeds.
  */

  if (error) {

    console.warn(
      "Profile table:",
      error.message
    );

  }

}


async function loadProfile() {

  if (!currentUser) return;

  const {
    data,
    error
  } = await client
    .from("profiles")
    .select("id, username")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (!error && data) {

    currentProfile = data;

  } else {

    currentProfile = {
      id: currentUser.id,
      username:
        currentUser.user_metadata?.username ||
        currentUser.email?.split("@")[0] ||
        "user"
    };

  }

  updateProfileUI();

}


function updateProfileUI() {

  const username =
    currentProfile?.username || "User";

  document.getElementById(
    "sidebarUsername"
  ).textContent = username;

  const letter =
    username.charAt(0).toUpperCase() || "U";

  document.getElementById(
    "sidebarAvatar"
  ).textContent = letter;

  document.getElementById(
    "composerAvatar"
  ).textContent = letter;

}


/* ============================================================
   SHOW APP
============================================================ */

function showApp() {

  document.getElementById(
    "auth"
  ).style.display = "none";

  document.getElementById(
    "app"
  ).style.display = "block";

  loadFeed();

}


/* ============================================================
   CREATE POST
============================================================ */

async function createPost() {

  if (!currentUser) {

    alert("Please log in first.");

    return;
  }

  const content =
    document.getElementById(
      "postContent"
    ).value.trim();

  if (!content && !selectedImage) {

    alert(
      "Write something or select a photo."
    );

    return;
  }

  /*
    The existing posts table has:
      user_id
      content

    This keeps compatibility with your existing database.
  */

  const {
    error
  } = await client
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        content

    });

  if (error) {

    alert(error.message);

    return;
  }

  document.getElementById(
    "postContent"
  ).value = "";

  selectedImage = null;

  document.getElementById(
    "imagePreview"
  ).innerHTML = "";

  closeComposer();

  await loadFeed();

}


/* ============================================================
   LOAD FEED
============================================================ */

async function loadFeed() {

  const feed =
    document.getElementById("feed");

  feed.innerHTML =
    '<div class="loading">Loading feed...</div>';

  const {
    data: posts,
    error
  } = await client
    .from("posts")
    .select(
      "id, content, created_at, user_id"
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );

  if (error) {

    feed.innerHTML =
      "<p>" +
      escapeHtml(error.message) +
      "</p>";

    return;
  }

  if (!posts || posts.length === 0) {

    feed.innerHTML = `
      <div class="center muted">
        <h3>No posts yet</h3>
        <p>Be the first person to post something!</p>
      </div>
    `;

    return;
  }

  const userIds = [
    ...new Set(
      posts.map(
        post => post.user_id
      )
    )
  ];

  let profiles = [];

  const {
    data: profileData
  } = await client
    .from("profiles")
    .select(
      "id, username"
    )
    .in(
      "id",
      userIds
    );

  profiles = profileData || [];

  const profileMap = {};

  profiles.forEach(profile => {

    profileMap[
      profile.id
    ] = profile.username;

  });

  feed.innerHTML =
    posts.map(
      post =>
        renderPost(
          post,
          profileMap
        )
    ).join("");

}


/* ============================================================
   RENDER POST
============================================================ */

function renderPost(
  post,
  profileMap
) {

  const username =
    profileMap[
      post.user_id
    ] || "user";

  const initial =
    username
      .charAt(0)
      .toUpperCase();

  const date =
    post.created_at
      ? new Date(
          post.created_at
        ).toLocaleString()
      : "";

  const isMine =
    currentUser &&
    post.user_id === currentUser.id;

  return `

    <article
      class="post"
      id="post-${post.id}">

      <div class="post-header">

        <div class="avatar">
          ${escapeHtml(initial)}
        </div>

        <div>

          <div class="post-user">
            @${escapeHtml(username)}
          </div>

          <div class="post-date">
            ${escapeHtml(date)}
          </div>

        </div>

        ${
          isMine
          ? `
            <button
              class="post-menu"
              onclick="deletePost('${post.id}')">
              ⋯
            </button>
          `
          : ""
        }

      </div>

      <div class="post-content">
        ${escapeHtml(post.content)}
      </div>

      <div class="post-stats">

        <span id="like-count-${post.id}">
          👍 0
        </span>

        <span>
          <span id="comment-count-${post.id}">
            0
          </span>
          comments
        </span>

      </div>

      <div class="post-actions">

        <button
          class="action-btn"
          id="like-${post.id}"
          onclick="toggleLike('${post.id}')">
          👍 Like
        </button>

        <button
          class="action-btn"
          onclick="focusComment('${post.id}')">
          💬 Comment
        </button>

        <button
          class="action-btn"
          onclick="sharePost('${post.id}')">
          ↗ Share
        </button>

      </div>

      <div
        class="comments"
        id="comments-${post.id}">

      </div>

      <div class="comment-box">

        <input
          id="comment-${post.id}"
          class="comment-input"
          placeholder="Write a comment..."
          onkeydown="commentKey(event, '${post.id}')"
        >

        <button
          class="comment-send"
          onclick="addComment('${post.id}')">
          ➤
        </button>

      </div>

    </article>

  `;

}


/* ============================================================
   DELETE POST
============================================================ */

async function deletePost(postId) {

  if (!confirm(
    "Delete this post?"
  )) {
    return;
  }

  const {
    error
  } = await client
    .from("posts")
    .delete()
    .eq(
      "id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    );

  if (error) {

    alert(error.message);

    return;
  }

  await loadFeed();

}


/* ============================================================
   LIKE
============================================================ */

async function toggleLike(postId) {

  const button =
    document.getElementById(
      "like-" + postId
    );

  /*
    This is a local UI reaction.

    For permanent likes, create a "likes"
    table in Supabase and connect it here.
  */

  if (
    button.classList.contains("liked")
  ) {

    button.classList.remove("liked");

    button.textContent =
      "👍 Like";

  } else {

    button.classList.add("liked");

    button.textContent =
      "👍 Liked";

  }

}


/* ============================================================
   COMMENTS
============================================================ */

function focusComment(postId) {

  const input =
    document.getElementById(
      "comment-" + postId
    );

  if (input) {

    input.focus();

  }

}


function commentKey(
  event,
  postId
) {

  if (
    event.key === "Enter"
  ) {

    event.preventDefault();

    addComment(postId);

  }

}


function addComment(postId) {

  const input =
    document.getElementById(
      "comment-" + postId
    );

  const text =
    input.value.trim();

  if (!text) return;

  /*
    Temporary front-end comment.

    For permanent comments, create a
    comments table in Supabase.
  */

  const comments =
    document.getElementById(
      "comments-" + postId
    );

  const username =
    currentProfile?.username ||
    "You";

  const div =
    document.createElement("div");

  div.className =
    "comment";

  div.innerHTML =
    "<b>@" +
    escapeHtml(username) +
    "</b> " +
    escapeHtml(text);

  comments.appendChild(div);

  input.value = "";

  const count =
    comments.children.length;

  document.getElementById(
    "comment-count-" + postId
  ).textContent = count;

}


/* ============================================================
   SHARE
============================================================ */

async function sharePost(postId) {

  const url =
    window.location.href.split("#")[0] +
    "#post-" +
    postId;

  if (
    navigator.share
  ) {

    try {

      await navigator.share({
        title: "SocialHub post",
        text: "Check out this post on SocialHub.",
        url: url
      });

    } catch (error) {
      // User cancelled share.
    }

  } else {

    try {

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Post link copied!"
      );

    } catch {

      alert(
        "Share link: " + url
      );

    }

  }

}

function addFeeling() {

  const feelings = [
    "😊 Feeling happy",
    "😂 Feeling funny",
    "❤️ Feeling loved",
    "😎 Feeling cool",
    "🎉 Feeling excited",
    "😢 Feeling sad"

/* ============================================================
   SEARCH
============================================================ */

function searchPosts() {

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();

  const posts =
    document.querySelectorAll(
      ".post"
    );

  posts.forEach(post => {

    const text =
      post.textContent
        .toLowerCase();

    post.style.display =
      !query ||
      text.includes(query)
        ? "block"
        : "none";

  });

}

/* ============================================================
   SECURITY
============================================================ */

function escapeHtml(text) {

  return String(
    text ?? ""
  ).replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m];

    }
  );

}

    await loadProfile();

    showApp();

}

);
